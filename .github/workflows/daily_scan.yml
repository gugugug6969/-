name: Daily Stock Scan

on:
  # Free Reply API mode: group members send 掃描 to request a report.
  # Scheduled push is disabled to avoid paid message consumption.
  workflow_dispatch:
    inputs:
      test_only:
        description: "只發送 LINE 連線測試訊息"
        type: boolean
        required: false
        default: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID_2: ${{ secrets.LINE_GROUP_ID_2 }}
          LINE_TEST_ONLY: ${{ inputs.test_only && '1' || '0' }}
        run: python auto_scan.py
