name: Diagnose LINE Webhook Delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily_scan.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check LINE delivery settings and endpoint reachability
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const origin='https://quant-lab-line-reply.nuttybirch8.chatgpt.site';
          const a=await fetch('https://api.line.me/v2/oauth/accessToken',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.LINE_CHANNEL_ID,client_secret:process.env.LINE_CHANNEL_SECRET}),signal:AbortSignal.timeout(10000)});
          if(!a.ok)throw new Error('LINE auth HTTP '+a.status);
          const {access_token}=await a.json();
          const headers={Authorization:'Bearer '+access_token,'Content-Type':'application/json'};
          for(const path of ['/v2/bot/info','/v2/bot/channel/webhook/endpoint']){
            const r=await fetch('https://api.line.me'+path,{headers,signal:AbortSignal.timeout(10000)});
            console.log(path,r.status,await r.text());
          }
          const bytes=JSON.stringify({events:[]});
          const signature=createHmac('sha256',process.env.LINE_CHANNEL_SECRET).update(bytes).digest('base64');
          const start=Date.now();
          const ping=await fetch(origin+'/api/line/webhook',{method:'POST',headers:{'Content-Type':'application/json','x-line-signature':signature},body:bytes,signal:AbortSignal.timeout(10000)});
          console.log('SIGNED EMPTY WEBHOOK',ping.status,'MS',Date.now()-start,(await ping.text()).slice(0,200));
          const verify=await fetch('https://api.line.me/v2/bot/channel/webhook/test',{method:'POST',headers,body:JSON.stringify({endpoint:origin+'/api/line/webhook'}),signal:AbortSignal.timeout(15000)});
          console.log('LINE DELIVERY TEST',verify.status,await verify.text());
          JS
