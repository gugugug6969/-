name: Daily Stock Report Cache

on:
  schedule:
    # Weekdays 15:05 Asia/Taipei; GitHub may delay scheduled jobs.
    - cron: '5 7 * * 1,2,3,4,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scan and export report without LINE messages
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID_2: ${{ secrets.LINE_GROUP_ID_2 }}
          LINE_EXPORT_ONLY: '1'
          LINE_REPORT_PATH: report.json
        run: python auto_scan.py
      - name: Update signed report cache without LINE messages
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHmac} from 'node:crypto';
          const report=JSON.parse(readFileSync('report.json','utf8'));
          const body=JSON.stringify({operation:'publish_report',timestamp:Date.now(),report});
          const signature=createHmac('sha256',process.env.LINE_CHANNEL_SECRET).update(body).digest('base64');
          const r=await fetch('https://quant-lab-line-reply.nuttybirch8.chatgpt.site/api/line/reports',{method:'POST',headers:{'Content-Type':'application/json','x-line-signature':signature},body,signal:AbortSignal.timeout(30000)});
          const result=await r.text();
          console.log('Report update HTTP:',r.status);
          console.log('Report update result:',result.slice(0,1000));
          if(r.status!==200)throw new Error('Report update failed');
          JS
