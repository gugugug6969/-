name: Check deployed stock data acquisition
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily_scan.yml']
permissions:
  contents: read
jobs:
  check-data:
    runs-on: ubuntu-latest
    steps:
      - name: Run signed data diagnostic without LINE messages
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const body=JSON.stringify({operation:'scan',timestamp:Date.now()});
          const signature=createHmac('sha256',process.env.LINE_CHANNEL_SECRET).update(body).digest('base64');
          const r=await fetch('https://quant-lab-line-reply.nuttybirch8.chatgpt.site/api/line/diagnostics',{method:'POST',headers:{'Content-Type':'application/json','x-line-signature':signature},body,signal:AbortSignal.timeout(30000)});
          console.log('Stock diagnostic status:',r.status);
          console.log('Stock diagnostic result:',(await r.text()).slice(0,2000));
          JS
