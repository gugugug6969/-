name: Restore Default 100 Stock Report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily_scan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-default100:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Refresh original 100 only without LINE messages
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID_2: ${{ secrets.LINE_GROUP_ID_2 }}
          LINE_EXPORT_ONLY: '1'
          LINE_PUBLISH_DEFAULT: '1'
          LINE_REPORT_PATH: report.json
        run: python auto_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-100-report
          path: report.json
          retention-days: 2
      - name: Verify command results and LINE message format without sending
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const auth=await fetch('https://api.line.me/v2/oauth/accessToken',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.LINE_CHANNEL_ID,client_secret:process.env.LINE_CHANNEL_SECRET}),signal:AbortSignal.timeout(10000)});
          if(!auth.ok)throw new Error('LINE auth failed');const {access_token}=await auth.json();
          for(const query of ['掃描','南亞科 南亞','2408 1303','1240']){
            const body=JSON.stringify({operation:'preview_query',timestamp:Date.now(),query});
            const signature=createHmac('sha256',process.env.LINE_CHANNEL_SECRET).update(body).digest('base64');
            const started=Date.now();
            const r=await fetch('https://quant-lab-line-reply.nuttybirch8.chatgpt.site/api/line/reports',{method:'POST',headers:{'Content-Type':'application/json','x-line-signature':signature},body,signal:AbortSignal.timeout(10000)});
            if(!r.ok)throw new Error('Preview HTTP '+r.status);const data=await r.json();
            console.log('QUERY',query,'MS',Date.now()-started,'DATES',data.dataDates);
            console.log(data.text);
            if(query==='掃描'&&!data.text.includes('/100'))throw new Error('Default 100 scope regression');
            if(query.includes('南亞')&&(!data.text.includes('2408 南亞科')||!data.text.includes('1303 南亞')))throw new Error('Selected query regression');
            const texts=[];let chunk='';for(const line of data.text.split('\n')){if((chunk+'\n'+line).length>4800){texts.push(chunk);chunk='';}chunk+=(chunk?'\n':'')+line;}if(chunk)texts.push(chunk);
            const valid=await fetch('https://api.line.me/v2/bot/message/validate/reply',{method:'POST',headers:{Authorization:'Bearer '+access_token,'Content-Type':'application/json'},body:JSON.stringify({messages:texts.map(text=>({type:'text',text}))}),signal:AbortSignal.timeout(10000)});
            console.log('LINE validation HTTP',valid.status);if(!valid.ok)throw new Error('LINE format rejected');
          }
          JS
